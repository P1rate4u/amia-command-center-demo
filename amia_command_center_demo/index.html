 if(kind==='project')openModal('Add Demo Project',`<div class="form-grid"><div class="field"><label>Client</label><input id="fClient" value="Demo Biotech Co."></div><div class="field"><label>Project name</label><input id="fProject" value="IND Readiness Review"></div><div class="field"><label>Owner</label><select id="fOwner"><option>Sarah</option><option>Ahmed</option><option>Maria</option><option>David</option><option>Sarmad</option></select></div><div class="field"><label>Due date</label><input id="fDue" type="date" value="2026-10-30"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addProject()">Create project</button>`);
 if(kind==='task')openModal('Add Demo Task',`<div class="form-grid"><div class="field" style="grid-column:1/-1"><label>Task</label><input id="fTask" value="Review project documents"></div><div class="field"><label>Owner</label><select id="fTaskOwner"><option>Sarmad</option><option>Sarah</option><option>Ahmed</option><option>Maria</option><option>Louis</option></select></div><div class="field"><label>Due</label><input id="fTaskDue" type="date" value="2026-10-21"></div><div class="field"><label>Priority</label><select id="fTaskPriority"><option>High</option><option>Medium</option><option>Low</option></select></div><div class="field"><label>Project</label><select id="fTaskProject">${state.projects.map(p=>`<option>${p.id}</option>`).join('')}<option>Ops</option><option>Investor</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addTask()">Create task</button>`);
 if(kind==='investor')openModal('Add Demo Investor',`<div class="form-grid"><div class="field"><label>Investor / Fund</label><input id="fInvName" value="Demo Health Ventures"></div><div class="field"><label>Fit score</label><input id="fInvScore" type="number" value="82" min="0" max="100"></div><div class="field"><label>Status</label><select id="fInvStatus"><option>Scheduled</option><option>Sent</option><option>Replied</option><option>Interested</option></select></div><div class="field"><label>Owner</label><select id="fInvOwner"><option>Sarmad</option><option>Louis</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addInvestor()">Add investor</button>`)
}
window.addProject=()=>{const id='AM-'+String(state.projects.length+1).padStart(3,'0');const client=$('#fClient').value.trim();if(!client)return;state.projects.push({id,client,name:$('#fProject').value.trim(),owner:$('#fOwner').value,stage:'Documents',due:$('#fDue').value,status:'On Track',progress:10,blocker:''});state.customers.push({name:client,type:'Biotech',status:'Active',owner:$('#fOwner').value,project:id});state.tasks.push({id:'T-'+String(state.tasks.length+1).padStart(3,'0'),title:'Create project document checklist',project:id,owner:$('#fOwner').value,due:$('#fDue').value,priority:'High',status:'Open'});state.automations.unshift({time:'Just now',name:'Project Setup',status:'Success',details:`${id} created with starter task`});save();closeModal();renderAll();toast('Project created',`${id} — ${client}`)}
window.addTask=()=>{state.tasks.push({id:'T-'+String(state.tasks.length+1).padStart(3,'0'),title:$('#fTask').value.trim(),project:$('#fTaskProject').value,owner:$('#fTaskOwner').value,due:$('#fTaskDue').value,priority:$('#fTaskPriority').value,status:'Open'});save();closeModal();renderAll();toast('Task created',$('#fTask')?.value||'New demo task')}
window.addInvestor=()=>{state.investors.push({id:'I-'+String(state.investors.length+1).padStart(3,'0'),name:$('#fInvName').value.trim(),firm:'Demo',score:+$('#fInvScore').value,status:$('#fInvStatus').value,last:'2026-10-19',follow:'2026-10-22',owner:$('#fInvOwner').value});save();closeModal();renderAll();toast('Demo investor added','Investor tracker updated.')}
function runAutomation(){const missing=state.documents.filter(d=>d.status==='Missing').length, open=state.tasks.filter(t=>t.status!=='Done').length;state.automations.unshift({time:'Just now',name:'Command Center Health Check',status:'Success',details:`Checked ${state.projects.length} projects, ${open} open tasks, ${missing} missing documents`});save();renderAll();toast('Automation health check complete',`${missing} missing documents · ${open} open tasks.`)}
$('#modalClose').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};$('#quickActionBtn').onclick=()=>openModal('Quick Actions',`<div class="grid stack-2" style="margin-top:0"><button class="btn primary" onclick="closeModal();openForm('project')">+ Add demo project</button><button class="btn" onclick="closeModal();openForm('task')">+ Add demo task</button><button class="btn" onclick="closeModal();openForm('investor')">+ Add demo investor</button><button class="btn success" onclick="closeModal();runAutomation()">Run health check</button></div><div class="skeleton-note">All actions modify demo data in this browser only.</div>`,`<button class="btn" onclick="closeModal()">Close</button>`);
window.openForm=openForm;window.closeModal=closeModal;window.runAutomation=runAutomation;
$('#notifyBtn').onclick=()=>toast('Demo notifications','2 missing documents · 1 failed workflow · 3 high-priority tasks.');
$('#resetDemo').onclick=()=>{if(confirm('Reset all demo changes?')){state=structuredClone(defaultState);save();renderAll();goPage('dashboard');toast('Demo reset','Original sample data restored.')}};
$$('.nav-btn[data-page]').forEach(b=>b.onclick=()=>goPage(b.dataset.page));
$('#globalSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),box=$('#searchResults');if(!q){box.classList.remove('show');return}let r=[];state.projects.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Project',title:`${x.id} — ${x.client}`,sub:x.stage,page:'mednova'}));state.investors.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Investor',title:x.name,sub:x.status,page:'investors'}));state.tasks.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Task',title:x.title,sub:x.owner,page:'tasks'}));state.documents.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Document',title:x.name,sub:`${x.project} · ${x.status}`,page:'documents'}));box.innerHTML=r.slice(0,10).map((x,i)=>`<div class="search-item" data-search-page="${x.page}"><b>${x.title}</b><small>${x.type} · ${x.sub}</small></div>`).join('')||'<div class="empty">No demo results</div>';box.classList.add('show');$$('[data-search-page]').forEach(x=>x.onclick=()=>{goPage(x.dataset.searchPage);box.classList.remove('show');$('#globalSearch').value=''});});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape'){closeModal();$('#searchResults').classList.remove('show')}});
renderAll();
</script>
</body>
</html>
