/* Outreach workspace navigation + animated outreach status */
.nav-section-label{
  padding:17px 13px 7px;
  color:#9aa8b8;
  font-size:9px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.nav-btn.nav-sub{
  margin-left:7px;
  width:calc(100% - 7px);
  position:relative;
}
.nav-btn.nav-sub:before{
  content:"";
  position:absolute;
  left:-7px;
  top:7px;
  bottom:7px;
  width:2px;
  border-radius:3px;
  background:#e7ecf2;
}
.nav-btn.nav-sub.active:before{background:#3771c6}
.nav-btn.nav-locked{
  opacity:.57;
  cursor:not-allowed;
  background:transparent!important;
}
.nav-btn.nav-locked:hover{background:transparent!important;color:#596b7e!important}
.nav-lock{
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 6px;
  border-radius:999px;
  background:#f1f3f6;
  border:1px solid #e3e7ec;
  color:#8b98a7;
  font-size:8px;
  font-weight:800;
  letter-spacing:.02em;
}
.outreach-zone{
  margin:0 0 18px;
  padding:18px;
  border:1px solid #dfe8f2;
  border-radius:16px;
  background:
    radial-gradient(circle at 12% 0%,rgba(47,111,194,.08),transparent 30%),
    linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
  box-shadow:0 8px 28px rgba(27,60,97,.045);
}
.outreach-zone-head{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start;
  margin-bottom:14px;
}
.outreach-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#3970af;
  font-size:9px;
  font-weight:850;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:4px;
}
.outreach-eyebrow:before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:#2f78cf;
  box-shadow:0 0 0 5px rgba(47,120,207,.09);
  animation:outreachPulse 2.1s ease-in-out infinite;
}
.outreach-zone-head h3{margin:0;color:#203750;font-size:16px}
.outreach-zone-head p{margin:5px 0 0;color:#8694a5;font-size:11px}
.outreach-live-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border-radius:999px;
  color:#28785b;
  background:#edf8f2;
  border:1px solid #d2ecdf;
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
}
.outreach-live-pill:before{
  content:"";
  width:6px;height:6px;border-radius:50%;
  background:#2aa473;
  animation:outreachPulse 2s ease-in-out infinite;
}
.outreach-stream-grid{
  display:grid;
  grid-template-columns:1.2fr .9fr .9fr;
  gap:12px;
}
.outreach-stream{
  position:relative;
  min-height:168px;
  border:1px solid #e2e8ef;
  border-radius:14px;
  background:#fff;
  padding:16px;
  overflow:visible;
}
button.outreach-stream{
  width:100%;
  text-align:left;
  color:inherit;
  font:inherit;
  cursor:pointer;
}
.outreach-stream-investor{
  display:grid;
  grid-template-columns:minmax(0,1fr) 120px;
  gap:16px;
  align-items:center;
  border-color:#cddff4;
  background:
    linear-gradient(115deg,rgba(236,245,255,.92),rgba(255,255,255,.98) 52%),
    #fff;
  box-shadow:0 6px 22px rgba(38,93,157,.07);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.outreach-stream-investor:hover,
.outreach-stream-investor:focus-visible{
  transform:translateY(-3px);
  border-color:#9ebfe8;
  box-shadow:0 16px 34px rgba(39,88,145,.13);
  outline:none;
}
.outreach-stream-name{
  display:flex;
  align-items:center;
  gap:8px;
  color:#263d56;
  font-size:13px;
  font-weight:800;
}
.outreach-stream-desc{
  margin-top:6px;
  color:#7d8ea0;
  font-size:10px;
  line-height:1.55;
}
.outreach-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:5px 8px;
  border-radius:8px;
  color:#2d6db7;
  background:#eaf3ff;
  border:1px solid #d3e5fb;
  font-size:9px;
  font-weight:800;
}
.outreach-status .dot{
  width:6px;height:6px;border-radius:50%;background:#3382d8;
  box-shadow:0 0 0 4px rgba(51,130,216,.08);
}
.outreach-ring-wrap{
  width:112px;
  height:112px;
  position:relative;
  display:grid;
  place-items:center;
  margin-left:auto;
}
.outreach-ring{
  width:112px;height:112px;
  transform:rotate(-90deg);
  filter:drop-shadow(0 7px 14px rgba(37,100,174,.10));
}
.outreach-ring-track{
  fill:none;
  stroke:#e8eef5;
  stroke-width:9;
}
.outreach-ring-fill{
  fill:none;
  stroke:#2e73c6;
  stroke-linecap:round;
  stroke-width:9;
  stroke-dasharray:100;
  stroke-dashoffset:var(--offset);
  animation:ringDraw 1.15s cubic-bezier(.2,.75,.25,1) both;
}
.outreach-ring-center{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  align-content:center;
  text-align:center;
  color:#204b7e;
  font-size:22px;
  font-weight:850;
  letter-spacing:-.04em;
}
.outreach-ring-center small{
  display:block;
  margin-top:1px;
  color:#8a98a8;
  font-size:8px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.outreach-hover-details{
  position:absolute;
  z-index:5;
  left:14px;
  right:14px;
  top:calc(100% - 5px);
  opacity:0;
  transform:translateY(-5px) scale(.985);
  pointer-events:none;
  border:1px solid #d7e4f2;
  border-radius:12px;
  padding:11px 12px;
  background:rgba(255,255,255,.98);
  box-shadow:0 18px 40px rgba(32,67,105,.16);
  transition:opacity .18s ease,transform .18s ease;
}
.outreach-stream-investor:hover .outreach-hover-details,
.outreach-stream-investor:focus-visible .outreach-hover-details{
  opacity:1;
  transform:translateY(0) scale(1);
}
.outreach-hover-title{
  color:#6d7f92;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:850;
  margin-bottom:7px;
}
.outreach-hover-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}
.outreach-hover-stat{
  padding:7px 6px;
  border-radius:8px;
  background:#f6f9fc;
  border:1px solid #eaf0f5;
  text-align:center;
}
.outreach-hover-stat b{display:block;color:#233d59;font-size:13px}
.outreach-hover-stat span{display:block;color:#8493a3;font-size:8px;margin-top:2px}
.outreach-stream-locked{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  color:#7f8d9d;
  background:
    linear-gradient(135deg,rgba(248,249,251,.98),rgba(244,246,249,.95)),
    #f7f8fa;
  border-style:dashed;
}
.outreach-lock-icon{
  width:37px;height:37px;border-radius:11px;
  display:grid;place-items:center;
  background:#f0f2f5;
  border:1px solid #e2e6eb;
  color:#8b97a5;
  font-size:16px;
}
.outreach-lock-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #eceff3;
  font-size:9px;
  color:#9aa5b1;
}
.outreach-lock-footer b{
  color:#7e8a97;
  padding:3px 6px;
  border-radius:999px;
  background:#eceff2;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.05em;
}
@keyframes ringDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:var(--offset)}}
@keyframes outreachPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
@media(max-width:1100px){.outreach-stream-grid{grid-template-columns:1fr 1fr}.outreach-stream-investor{grid-column:1/-1}}
@media(max-width:800px){
  .nav-section-label{display:none}
  .nav-btn.nav-sub{margin-left:0;width:100%}
  .nav-btn.nav-sub:before,.nav-lock{display:none}
  .outreach-stream-grid{grid-template-columns:1fr}
  .outreach-stream-investor{grid-column:auto}
  .outreach-zone{padding:14px}
  .outreach-zone-head{align-items:flex-start}
}
@media(hover:none){
  .outreach-hover-details{
    position:static;
    opacity:1;
    transform:none;
    margin-top:12px;
    grid-column:1/-1;
    box-shadow:none;
  }
}

function renderTeam(){const acts=state.activities.map(a=>`<div class="list-item"><div class="list-icon">${a.who[0]}</div><div><strong>${a.who}</strong><small>${a.action}</small></div><span style="color:#7895ad;font-size:9px">${a.when}</span></div>`).join(''); const owners=['Louis','Jeet','Brandon','Hussnain'].map(o=>`<div class="metric-box"><div class="big">${state.tasks.filter(t=>t.owner===o&&t.status!=='Done').length}</div><div class="label">Open tasks — ${o}</div></div>`).join('');
 $('#team').innerHTML=pageHead('Team updates','An illustrative view of handoffs and assigned work.')+`<div class="grid two-col"><div class="card"><div class="card-head"><h3>Recent Activity</h3></div><div class="card-body"><div class="list">${acts}</div></div></div><div class="card"><div class="card-head"><h3>Current Workload</h3></div><div class="card-body"><div class="grid stack-2" style="margin-top:0">${owners}</div></div></div></div>`}
function renderDocuments(){const cards=state.documents.map(d=>`<div class="doc-card"><div style="display:flex;justify-content:space-between;gap:8px"><div class="doc-name"><button class="name-link" data-detail="document:${d.id}">${d.name}</button></div>${badge(d.status)}</div><div class="doc-project">${d.project} · ${projectName(d.project)} · owner ${d.owner}</div><div class="doc-actions"><button class="small-btn doc-toggle" data-id="${d.id}">${d.status==='Missing'?'Mark as received':'Mark as missing'}</button></div></div>`).join('');
 $('#documents').innerHTML=pageHead('Document checklist','Track missing and received items without storing files here.')+`<div class="grid doc-grid">${cards}</div>`}
function renderAutomation(){const rows=state.automations.map(a=>`<div class="log-row"><div>${a.time}</div><div><b>${a.name}</b></div><div>${badge(a.status)}</div><div>${a.details}</div></div>`).join('');
 $('#automation').innerHTML=pageHead('Workflow log','Illustrative workflow checks. No external integrations are connected.',`<button class="btn success" id="runAutomation">Run Sample Check</button>`)+`<div class="callout" style="margin-bottom:14px"><strong>Fail visibly:</strong> if a workflow fails, the last verified status stays visible and a repair item is created instead of silently changing data.</div><div class="page-panel"><div class="log-row header"><div>Time</div><div>Workflow</div><div>Status</div><div>Details</div></div>${rows}</div>`}
function renderReports(){const sent=state.investors.length, replies=state.investors.filter(i=>['Replied','Interested'].includes(i.status)).length;$('#reports').innerHTML=pageHead('Summary','An overview of the sample records.',`<button class="btn" id="exportDemo">Export Demo JSON</button>`)+`<div class="grid stack-3"><div class="metric-box"><div class="big">${sent}</div><div class="label">Investors in demo tracker</div></div><div class="metric-box"><div class="big">${replies}</div><div class="label">Positive reply signals</div></div><div class="metric-box"><div class="big">${state.projects.filter(p=>p.status==='At Risk').length}</div><div class="label">Projects at risk</div></div></div><div class="grid stack-2"><div class="card"><div class="card-head"><h3>Project Status Mix</h3></div><div class="card-body"><div class="donut-wrap"><div style="position:relative"><div class="donut" style="background:conic-gradient(var(--green) 0 40%,var(--yellow) 40% 80%,var(--blue) 80% 100%)"></div><div class="donut-center">${state.projects.length}<small>projects</small></div></div><div class="legend"><div class="legend-row"><span class="legend-dot" style="background:var(--green)"></span>On track / complete</div><div class="legend-row"><span class="legend-dot" style="background:var(--yellow)"></span>At risk</div><div class="legend-row"><span class="legend-dot" style="background:var(--blue)"></span>In progress</div></div></div></div></div><div class="card"><div class="card-head"><h3>What Louis Can Answer Quickly</h3></div><div class="card-body"><div class="list"><div class="list-item"><div class="list-icon">1</div><div><strong>What needs attention?</strong><small>At-risk projects, missing documents, failed automation.</small></div></div><div class="list-item"><div class="list-icon">2</div><div><strong>Who owns the next step?</strong><small>Every task and project has an owner.</small></div></div><div class="list-item"><div class="list-icon">3</div><div><strong>What changed?</strong><small>Activity and automation logs expose recent updates.</small></div></div></div></div></div></div>`}
function renderCustomers(){const rows=state.customers.map(c=>`<tr><td><button class="name-link" data-detail="project:${c.project}">${c.name}</button></td><td>${c.type}</td><td>${badge(c.status==='Active'?'On Track':c.status==='Delivery'?'Completed':'In Progress')}</td><td>${c.owner}</td><td>${c.project}</td><td><button class="small-btn" data-detail="project:${c.project}">Open project</button></td></tr>`).join('');$('#customers').innerHTML=pageHead('Clients','Fictional customers used to explain the demo workflow.')+`<div class="page-panel"><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Type</th><th>Status</th><th>Owner</th><th>Project</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function bindDynamic(){
 $$('[data-detail]').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();const [kind,id]=b.dataset.detail.split(':');showDetail(kind,id)}; b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});
 $$('.kpi-action').forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}});

 $$('[data-nav]').forEach(b=>b.onclick=()=>goPage(b.dataset.nav));
 $$('[data-open]').forEach(b=>b.onclick=()=>openForm(b.dataset.open));
 $$('[data-task-toggle]').forEach(c=>c.onchange=()=>{const t=state.tasks.find(x=>x.id===c.dataset.taskToggle);t.status=c.checked?'Done':'Open';save();renderAll();toast('Task updated',`${t.title} → ${t.status}`)});
 $$('.investor-status').forEach(s=>s.onchange=()=>{const i=state.investors.find(x=>x.id===s.dataset.id);i.status=s.value;i.last=new Date().toISOString().slice(0,10);save();renderAll();toast('Investor status updated',`${i.name} → ${i.status}`)});
 $$('.simulate-reply').forEach(b=>b.onclick=()=>{const i=state.investors.find(x=>x.id===b.dataset.id);i.status='Replied';i.last=new Date().toISOString().slice(0,10);state.activities.unshift({who:'Louis',action:`received a demo reply from ${i.name}`,when:'Just now'});save();renderAll();toast('Demo reply received',`${i.name} is now marked Replied.`)});
 $$('.doc-toggle').forEach(b=>b.onclick=()=>{const d=state.documents.find(x=>x.id===b.dataset.id);d.status=d.status==='Missing'?'Received':'Missing';const p=state.projects.find(x=>x.id===d.project);if(p){const hasMissing=state.documents.some(x=>x.project===p.id&&x.status==='Missing');p.status=hasMissing?'At Risk':(p.status==='At Risk'?'On Track':p.status);p.blocker=hasMissing?'Required document missing':'';}save();renderAll();toast('Document checklist updated',`${d.name} → ${d.status}`)});
 $$('.project-advance').forEach(b=>b.onclick=()=>{const p=state.projects.find(x=>x.id===b.dataset.id);if(!p)return;const stages=['Documents','MedNova Analysis','Expert Review','Approved - Delivery','Completed'];let idx=stages.indexOf(p.stage);if(idx===-1||idx===stages.length-1){toast('No further action','This sample project is already complete.');return;}if(p.stage==='Documents'&&state.documents.some(d=>d.project===p.id&&d.status==='Missing')){toast('Documents still missing','Mark the required checklist items as received first.');return;}if(p.stage==='Expert Review'&&!confirm('DEMO ONLY: Has an authorized expert already approved this report? Click OK to simulate recording approval. No real regulatory approval occurs.'))return;p.stage=stages[idx+1];p.progress=[25,55,78,94,100][idx+1];p.status=p.stage==='Completed'?'Completed':'On Track';p.blocker='';state.activities.unshift({who:p.owner,action:`updated ${p.id} to ${p.stage} (sample)`,when:'Just now'});save();renderAll();toast('Sample project updated',`${p.id} → ${p.stage}`)});
 $$('.task-progress').forEach(b=>b.onclick=()=>{const t=state.tasks.find(x=>x.id===b.dataset.id);const st=['Open','In Progress','Done'];t.status=st[(st.indexOf(t.status)+1)%st.length];save();renderAll();toast('Task status',`${t.title} → ${t.status}`)});
 if($('#runAutomation'))$('#runAutomation').onclick=runAutomation;
 if($('#exportDemo'))$('#exportDemo').onclick=()=>downloadFile('amia-demo-data.json',JSON.stringify(state,null,2),'application/json');
 if($('#exportInvestors'))$('#exportInvestors').onclick=()=>{const h='Name,Firm,Fit Score,Status,Last Activity,Follow-up,Owner\n';const csv=h+state.investors.map(i=>[i.name,i.firm,i.score,i.status,i.last,i.follow,i.owner].map(csvq).join(',')).join('\n');downloadFile('amia-demo-investors.csv',csv,'text/csv')};
 if($('#viewMode'))$('#viewMode').onchange=e=>{const map={'Investor Focus':'investors','MedNova Focus':'mednova','Task Focus':'tasks'};if(map[e.target.value])goPage(map[e.target.value])};
}
function showDetail(kind,id){window.__detail={kind,id};renderDetail(kind,id,true)}
function returnTo(page){window.__detail=null;goPage(page)}
function detailLink(kind,id,label){return `<button class="linktext" data-detail="${kind}:${id}">${label}</button>`}
function detailField(label,value){return `<div class="detail-field"><label>${label}</label><strong>${value}</strong></div>`}
function renderDetail(kind,id,navigate){
 let item,back='dashboard',title='',summary='',body='',buttons='';
 if(kind==='project'){
 item=state.projects.find(p=>p.id===id);if(!item)return;back='mednova';title=item.client;summary=item.name;
 const docs=state.documents.filter(d=>d.project===id);const tasks=state.tasks.filter(t=>t.project===id);
 body=`<div class="detail-grid"><div class="detail-panel"><h3 class="detail-subhead">Project overview</h3><div class="detail-list">${detailField('Project ID',item.id)}${detailField('Project owner',item.owner)}${detailField('Current stage',item.stage)}${detailField('Due date',item.due)}${detailField('Status',badge(item.status))}${detailField('Progress',item.progress+'%')}</div><p class="side-note">${item.blocker?'Current blocker: '+item.blocker:'No blockers recorded for this sample project.'}</p><div class="detail-actions"><button class="btn" data-nav="mednova">All projects</button><button class="btn" data-nav="tasks">Team tasks</button><button class="btn primary" data-project-detail-advance="${id}">Next stage</button></div><h3 class="detail-subhead">Tasks (${tasks.length})</h3>${tasks.length?tasks.map(t=>`<div class="team-row"><div class="who">${detailLink('task',t.id,t.title)}<div class="role">${t.owner} · due ${t.due}</div></div>${badge(t.status)}</div>`).join(''):'<p class="side-note">No tasks assigned yet.</p>'}</div><div class="detail-panel"><h3 class="detail-subhead">Document checklist (${docs.length})</h3>${docs.length?docs.map(d=>`<div class="team-row"><div class="who">${detailLink('document',d.id,d.name)}<div class="role">Owner: ${d.owner}</div></div>${badge(d.status)}</div>`).join(''):'<p class="side-note">No checklist items in the sample record.</p>'}<p class="side-note">This is a tracking view only; no clinical files are stored or transferred.</p></div></div>`;
 }
 else if(kind==='investor'){
 item=state.investors.find(i=>i.id===id);if(!item)return;back='investors';title=item.name;summary='Investor status detail';
 body=`<div class="detail-grid"><div class="detail-panel"><h3 class="detail-subhead">Outreach record</h3><div class="detail-list">${detailField('Fund',item.firm)}${detailField('Fit score',item.score+'%')}${detailField('Recorded status',badge(item.status))}${detailField('Owner',item.owner)}${detailField('Last activity',item.last)}${detailField('Follow-up date',item.follow)}</div><h3 class="detail-subhead">Update sample status</h3><select class="select" id="detailInvestorStatus">${['Scheduled','Sent','Replied','Interested','Follow-up Due'].map(x=>`<option ${x===item.status?'selected':''}>${x}</option>`).join('')}</select><div class="detail-actions"><button class="btn primary" data-save-investor="${id}">Save example status</button><button class="btn" data-nav="investors">All investors</button></div></div><div class="detail-panel"><h3 class="detail-subhead">What this means</h3><p class="side-note">A scheduled email is not a sent email. Changing these example statuses does not send an email, notify an investor, or connect to Apollo.</p><div class="demo-guide"><b>Example next step:</b> ${item.status==='Replied'||item.status==='Interested'?'Louis reviews the reply and decides how to respond.':item.status==='Scheduled'?'Wait for a confirmed send event before treating this as sent.':'Check the approved outreach workflow before acting.'}</div></div></div>`;
 }
 else if(kind==='task'){
 item=state.tasks.find(t=>t.id===id);if(!item)return;back='tasks';title=item.title;summary='Team task';
 body=`<div class="detail-grid"><div class="detail-panel"><h3 class="detail-subhead">Task details</h3><div class="detail-list">${detailField('Owner',item.owner)}${detailField('Task ID',item.id)}${detailField('Project',item.project.startsWith('AM-')?detailLink('project',item.project,projectName(item.project)):item.project)}${detailField('Due date',item.due)}${detailField('Priority',item.priority)}${detailField('Status',badge(item.status))}</div><h3 class="detail-subhead">Change sample task status</h3><select class="select" id="detailTaskStatus">${['Open','In Progress','Done'].map(x=>`<option ${x===item.status?'selected':''}>${x}</option>`).join('')}</select><div class="detail-actions"><button class="btn primary" data-save-task="${id}">Save task</button><button class="btn" data-nav="tasks">All tasks</button></div></div><div class="detail-panel"><h3 class="detail-subhead">Ownership</h3><p class="side-note">An assigned owner is responsible for updating this task. The dashboard recalculates open work whenever the sample status changes.</p></div></div>`;
 }
 else if(kind==='document'){
 item=state.documents.find(d=>d.id===id);if(!item)return;back='documents';title=item.name;summary='Document checklist item';
 body=`<div class="detail-grid"><div class="detail-panel"><h3 class="detail-subhead">Checklist entry</h3><div class="detail-list">${detailField('Project',detailLink('project',item.project,projectName(item.project)))}${detailField('Owner',item.owner)}${detailField('Status',badge(item.status))}${detailField('Reference',item.id)}</div><div class="detail-actions"><button class="btn primary" data-toggle-document="${id}">${item.status==='Missing'?'Mark example received':'Mark example missing'}</button><button class="btn" data-nav="documents">All documents</button></div></div><div class="detail-panel"><h3 class="detail-subhead">Delivery safety</h3><p class="side-note">This demo never uploads or transmits a source document. Missing checklist items prevent the related sample project from moving beyond document collection.</p></div></div>`;
 }else return;
 $('#detail').innerHTML=`<div class="breadcrumb"><button data-nav="dashboard">Overview</button> / <button data-nav="${back}">${({mednova:'Client projects',investors:'Investor tracker',tasks:'Team tasks',documents:'Document checklist'})[back]}</button> / ${id}</div>${pageHead(title,summary,`<button class="btn" data-nav="${back}">← Back</button>`)}${body}<div class="footer-note">Interactive sample record · Browser-only changes · No live Amia systems connected</div>`;
 $$('#detail [data-nav]').forEach(b=>b.onclick=()=>returnTo(b.dataset.nav));
 $$('#detail [data-detail]').forEach(b=>b.onclick=()=>{const [type,key]=b.dataset.detail.split(':');showDetail(type,key)});
 const taskSave=$('#detail [data-save-task]');if(taskSave)taskSave.onclick=()=>{const t=state.tasks.find(t=>t.id===taskSave.dataset.saveTask);t.status=$('#detailTaskStatus').value;state.activities.unshift({who:t.owner,action:'updated sample task '+t.id,when:'Just now'});save();renderAll();showDetail('task',t.id);toast('Task saved','Sample overview and task lists updated.');};
 const investorSave=$('#detail [data-save-investor]');if(investorSave)investorSave.onclick=()=>{const i=state.investors.find(x=>x.id===investorSave.dataset.saveInvestor);i.status=$('#detailInvestorStatus').value;i.last=new Date().toISOString().slice(0,10);save();renderAll();showDetail('investor',i.id);toast('Investor record updated','No external messages were sent.');};
 const docToggle=$('#detail [data-toggle-document]');if(docToggle)docToggle.onclick=()=>{const b=document.querySelector(`.doc-toggle[data-id="${docToggle.dataset.toggleDocument}"]`);if(b){b.click();showDetail('document',docToggle.dataset.toggleDocument)}else{const d=state.documents.find(d=>d.id===docToggle.dataset.toggleDocument);d.status=d.status==='Missing'?'Received':'Missing';save();renderAll();showDetail('document',d.id)}};
 const projAdvance=$('#detail [data-project-detail-advance]');if(projAdvance)projAdvance.onclick=()=>{const b=document.querySelector(`.project-advance[data-id="${projAdvance.dataset.projectDetailAdvance}"]`);if(b){b.click();showDetail('project',projAdvance.dataset.projectDetailAdvance)}};
 if(navigate)goPage('detail');
}
function csvq(s){return '"'+String(s).replaceAll('"','""')+'"'}
function downloadFile(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function goPage(page){if(page!=='detail')window.__detail=null;$$('.page').forEach(p=>p.classList.toggle('active',p.id===page));$$('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'})}
function openModal(title,body,foot=''){ $('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show')}
function openForm(kind){
 if(kind==='project')openModal('Add Sample Project',`<div class="form-grid"><div class="field"><label>Client</label><input id="fClient" value="Demo Biotech Co."></div><div class="field"><label>Project name</label><input id="fProject" value="IND Readiness Review"></div><div class="field"><label>Owner</label><select id="fOwner"><option>Jeet</option><option>Brandon</option><option>Hussnain</option></select></div><div class="field"><label>Due date</label><input id="fDue" type="date" value="2026-10-30"></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addProject()">Create project</button>`);
 if(kind==='task')openModal('Add Sample Task',`<div class="form-grid"><div class="field" style="grid-column:1/-1"><label>Task</label><input id="fTask" value="Review project documents"></div><div class="field"><label>Owner</label><select id="fTaskOwner"><option>Jeet</option><option>Brandon</option><option>Hussnain</option><option>Louis</option></select></div><div class="field"><label>Due</label><input id="fTaskDue" type="date" value="2026-10-21"></div><div class="field"><label>Priority</label><select id="fTaskPriority"><option>High</option><option>Medium</option><option>Low</option></select></div><div class="field"><label>Project</label><select id="fTaskProject">${state.projects.map(p=>`<option>${p.id}</option>`).join('')}<option>Ops</option><option>Investor</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addTask()">Create task</button>`);
 if(kind==='investor')openModal('Add Sample Investor',`<div class="form-grid"><div class="field"><label>Investor / Fund</label><input id="fInvName" value="Sample Seed Fund"></div><div class="field"><label>Fit score</label><input id="fInvScore" type="number" value="82" min="0" max="100"></div><div class="field"><label>Status</label><select id="fInvStatus"><option>Scheduled</option><option>Sent</option><option>Replied</option><option>Interested</option></select></div><div class="field"><label>Owner</label><select id="fInvOwner"><option>Hussnain</option><option>Louis</option></select></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addInvestor()">Add investor</button>`)
}
window.addProject=()=>{const id='AM-'+String(state.projects.length+1).padStart(3,'0');const client=cleanText($('#fClient').value);if(!client)return;state.projects.push({id,client,name:cleanText($('#fProject').value),owner:$('#fOwner').value,stage:'Documents',due:$('#fDue').value,status:'On Track',progress:10,blocker:''});state.customers.push({name:client,type:'Biotech',status:'Active',owner:$('#fOwner').value,project:id});state.documents.push({id:'D-'+String(state.documents.length+1).padStart(3,'0'),project:id,name:'Project intake checklist',status:'Missing',owner:$('#fOwner').value});state.tasks.push({id:'T-'+String(state.tasks.length+1).padStart(3,'0'),title:'Create project document checklist',project:id,owner:$('#fOwner').value,due:$('#fDue').value,priority:'High',status:'Open'});state.automations.unshift({time:'Just now',name:'Project Setup',status:'Success',details:`${id} created with starter task`});save();closeModal();renderAll();toast('Project created',`${id} — ${client}`)}
window.addTask=()=>{state.tasks.push({id:'T-'+String(state.tasks.length+1).padStart(3,'0'),title:cleanText($('#fTask').value),project:$('#fTaskProject').value,owner:$('#fTaskOwner').value,due:$('#fTaskDue').value,priority:$('#fTaskPriority').value,status:'Open'});save();closeModal();renderAll();toast('Task created','The sample task was added.')}
window.addInvestor=()=>{state.investors.push({id:'I-'+String(state.investors.length+1).padStart(3,'0'),name:cleanText($('#fInvName').value),firm:'Demo',score:+$('#fInvScore').value,status:$('#fInvStatus').value,last:'2026-10-19',follow:'2026-10-22',owner:$('#fInvOwner').value});save();closeModal();renderAll();toast('Demo investor added','Investor tracker updated.')}
function runAutomation(){const missing=state.documents.filter(d=>d.status==='Missing').length, open=state.tasks.filter(t=>t.status!=='Done').length;state.automations.unshift({time:'Just now',name:'Command Center Health Check',status:'Success',details:`Checked ${state.projects.length} projects, ${open} open tasks, ${missing} missing documents`});save();renderAll();toast('Sample check complete',`${missing} missing documents · ${open} open tasks.`)}
$('#modalClose').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};$('#quickActionBtn').onclick=()=>openModal('Quick Actions',`<div class="grid stack-2" style="margin-top:0"><button class="btn primary" onclick="closeModal();openForm('project')">+ Add demo project</button><button class="btn" onclick="closeModal();openForm('task')">+ Add demo task</button><button class="btn" onclick="closeModal();openForm('investor')">+ Add demo investor</button><button class="btn success" onclick="closeModal();runAutomation()">Run health check</button></div><div class="skeleton-note">All actions modify demo data in this browser only.</div>`,`<button class="btn" onclick="closeModal()">Close</button>`);
window.openForm=openForm;window.closeModal=closeModal;window.runAutomation=runAutomation;
$('#notifyBtn').onclick=()=>toast('Sample alerts',state.documents.filter(d=>d.status==='Missing').length+' missing document(s) · '+state.automations.filter(a=>a.status==='Failed').length+' workflow issue(s).');
$('#resetDemo').onclick=()=>{if(confirm('Reset all demo changes?')){state=structuredClone(defaultState);save();renderAll();goPage('dashboard');toast('Demo reset','Original sample data restored.')}};
$$('.nav-btn[data-page]').forEach(b=>b.onclick=()=>goPage(b.dataset.page));
$('#globalSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),box=$('#searchResults');if(!q){box.classList.remove('show');return}let r=[];state.projects.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Project',title:`${x.id} — ${x.client}`,sub:x.stage,page:'mednova'}));state.investors.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Investor',title:x.name,sub:x.status,page:'investors'}));state.tasks.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Task',title:x.title,sub:x.owner,page:'tasks'}));state.documents.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>r.push({type:'Document',title:x.name,sub:`${x.project} · ${x.status}`,page:'documents'}));box.innerHTML=r.slice(0,10).map((x,i)=>`<div class="search-item" data-search-page="${x.page}"><b>${x.title}</b><small>${x.type} · ${x.sub}</small></div>`).join('')||'<div class="empty">No demo results</div>';box.classList.add('show');$$('[data-search-page]').forEach(x=>x.onclick=()=>{goPage(x.dataset.searchPage);box.classList.remove('show');$('#globalSearch').value=''});});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape'){closeModal();$('#searchResults').classList.remove('show')}});
renderAll();
</script>
</body>
</html>
